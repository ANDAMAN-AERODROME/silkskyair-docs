name: Deploy docs to GitHub Pages

# Builds the static HTML from the Markdown sources (pnpm build:html) and
# publishes the repo as a GitHub Pages site. Runs on every push to main and
# can be triggered manually.
#
# One-time setup: in the repository Settings → Pages, set
# "Build and deployment → Source" to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions required by the Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render HTML
        run: pnpm build:html

      - name: Assemble site
        run: |
          mkdir -p _site
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./_site' \
            --exclude='./.github' \
            -cf - . | tar -xf - -C _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
